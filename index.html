<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5B21B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-apple-touch.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asha Bangles Wholesale">
<title>Asha Bangles Wholesale</title>
<style>
:root{
  --primary:#5B21B6;
  --primary-light:#7C3AED;
  --primary-dark:#3B1275;
  --accent:#FF6B4A;
  --accent-dark:#E5502F;
  --teal:#06B6D4;
  --success:#10B981;
  --warning:#F59E0B;
  --danger:#EF4444;
  --bg:#F5F3FB;
  --card:#FFFFFF;
  --text:#221B36;
  --muted:#7A7590;
  --border:#E9E4F5;
  --radius:16px;
  --shadow:0 4px 16px rgba(91,33,182,0.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overscroll-behavior:none;
}
#appRoot{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;}

/* Top bar */
.topbar{
  background:linear-gradient(120deg,var(--primary) 0%,var(--primary-light) 100%);
  color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(59,18,117,0.25);
}
.topbar .backBtn{background:rgba(255,255,255,0.18); border:none; color:#fff; width:34px;height:34px;border-radius:10px;font-size:18px; display:flex;align-items:center;justify-content:center;cursor:pointer;}
.topbar .titleBlock{flex:1; min-width:0;}
.topbar h1{font-size:17px; margin:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar .sub{font-size:11px; opacity:0.85; margin-top:1px;}
.topbar .iconBtn{background:rgba(255,255,255,0.18); border:none; color:#fff; width:34px;height:34px;border-radius:10px;font-size:16px; display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* Content */
#content{flex:1; padding:14px 14px 90px 14px; overflow-y:auto;}

/* Bottom nav */
.bottomnav{position:sticky; bottom:0; background:#fff; display:flex; border-top:1px solid var(--border); z-index:50; box-shadow:0 -4px 16px rgba(91,33,182,0.08);}
.navbtn{flex:1; border:none; background:none; padding:8px 2px 10px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; color:var(--muted); cursor:pointer; font-weight:600;}
.navbtn .ic{font-size:19px;}
.navbtn.active{color:var(--primary);}
.navbtn.active .ic{transform:scale(1.1);}

/* Cards */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.statcard{border-radius:14px; padding:14px; color:#fff; position:relative; overflow:hidden;}
.statcard .val{font-size:20px; font-weight:800; margin-top:4px;}
.statcard .lbl{font-size:11.5px; opacity:0.92; font-weight:600;}
.statcard .ic{position:absolute; right:10px; top:10px; font-size:26px; opacity:0.35;}
.sc1{background:linear-gradient(135deg,#7C3AED,#5B21B6);}
.sc2{background:linear-gradient(135deg,#FF8A65,#FF6B4A);}
.sc3{background:linear-gradient(135deg,#22D3EE,#06B6D4);}
.sc4{background:linear-gradient(135deg,#34D399,#10B981);}

.sectionTitle{font-size:14.5px; font-weight:800; color:var(--primary-dark); margin:18px 0 8px; display:flex; align-items:center; justify-content:space-between;}
.sectionTitle a{font-size:12px; color:var(--accent); font-weight:700; cursor:pointer;}

.quickrow{display:flex; gap:8px; margin-bottom:6px;}
.qbtn{flex:1; border:none; border-radius:12px; padding:12px 6px; font-size:12px; font-weight:700; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;}
.qbtn .ic{font-size:18px;}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:12px; padding:12px 16px; font-weight:700; font-size:14px; cursor:pointer;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-outline{background:#fff; border:1.5px solid var(--border); color:var(--text);}
.btn-success{background:var(--success); color:#fff;}
.btn-danger{background:var(--danger); color:#fff;}
.btn-teal{background:var(--teal); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:8px 10px; font-size:12.5px; border-radius:9px;}
.btn:disabled{opacity:0.5;}

/* Forms */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:1.5px solid var(--border); font-size:14.5px; background:#fff; color:var(--text); font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--primary-light);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

/* Search */
.searchbar{display:flex; gap:8px; margin-bottom:12px;}
.searchbar input{flex:1; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border); font-size:14px;}
.searchbar .fab{width:44px;height:44px;border-radius:12px; background:var(--accent); color:#fff; border:none; font-size:20px; flex-shrink:0;}
.scannerOverlay{position:fixed; inset:0; background:#000; z-index:500; display:flex; flex-direction:column; overflow:hidden;}
.scannerOverlay video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.scannerOverlay .scanTopBar{position:absolute; top:0; left:0; right:0; padding:16px; display:flex; justify-content:space-between; align-items:center; z-index:3; background:linear-gradient(rgba(0,0,0,0.5),transparent);}
.scannerOverlay .scanTitle{color:#fff; font-weight:700; font-size:15px;}
.scannerOverlay .scanClose{background:rgba(255,255,255,0.2); color:#fff; border:none; width:38px; height:38px; border-radius:12px; font-size:18px; cursor:pointer;}
.scanFrame{position:absolute; top:44%; left:50%; transform:translate(-50%,-50%); width:78%; max-width:340px; aspect-ratio:1.7; border:3px solid var(--accent); border-radius:16px; z-index:2; box-shadow:0 0 0 2000px rgba(0,0,0,0.4);}
.scannerOverlay .scanHint{position:absolute; bottom:50px; left:0; right:0; text-align:center; color:#fff; font-size:13.5px; font-weight:600; z-index:3; padding:0 20px;}

.chiprow{display:flex; gap:7px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;}
.chip{flex-shrink:0; padding:7px 14px; border-radius:20px; background:#fff; border:1.5px solid var(--border); font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap;}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

/* Product card */
.plist{display:flex; flex-direction:column; gap:10px;}
.pcard{background:#fff; border-radius:14px; box-shadow:var(--shadow); display:flex; gap:10px; padding:10px; position:relative;}
.pcard img{width:64px;height:64px;border-radius:10px;object-fit:cover; background:#EFEAFB; flex-shrink:0;}
.pcard .noimg{width:64px;height:64px;border-radius:10px;background:#EFEAFB; display:flex;align-items:center;justify-content:center; font-size:24px; flex-shrink:0;}
.pcard .info{flex:1; min-width:0;}
.pcard .pname{font-weight:800; font-size:14.5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pcard .pcat{font-size:11px; color:var(--muted); margin-bottom:5px;}
.pcard .pmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.price{font-weight:800; color:var(--primary-dark); font-size:14px;}
.badge{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:20px;}
.badge-ok{background:#DCFCE7; color:#15803D;}
.badge-low{background:#FEF3C7; color:#B45309;}
.badge-out{background:#FEE2E2; color:#B91C1C;}
.pcard .actions{display:flex; flex-direction:column; gap:6px; justify-content:center;}
.iconsm{width:32px;height:32px;border-radius:9px;border:none;background:#F3EEFF;color:var(--primary); font-size:14px; cursor:pointer;}
.checkdot{position:absolute; left:8px; top:8px; width:20px;height:20px;border-radius:50%; border:2px solid #fff; background:var(--border);}
.checkdot.on{background:var(--success);}

/* Invoice / list rows */
.listrow{background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;}
.listrow .l1{font-weight:800; font-size:14px;}
.listrow .l2{font-size:11.5px; color:var(--muted); margin-top:2px;}
.statuschip{font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:20px; flex-shrink:0;}
.st-paid{background:#DCFCE7; color:#15803D;}
.st-partial{background:#FEF3C7; color:#B45309;}
.st-udhar{background:#FEE2E2; color:#B91C1C;}

/* Cart */
.cartrow{display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:9px 10px; margin-bottom:8px; box-shadow:var(--shadow);}
.cartrow .ci{flex:1; min-width:0;}
.cartrow .cn{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cartrow .cp{font-size:11.5px; color:var(--muted);}
.stepper{display:flex; align-items:center; gap:6px;}
.stepper button{width:26px;height:26px;border-radius:8px; border:none; background:var(--primary); color:#fff; font-size:15px; font-weight:800; cursor:pointer;}
.stepper span{min-width:20px; text-align:center; font-weight:800; font-size:13px;}

.totalsbox{background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:14px; margin:12px 0;}
.trow{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px;}
.trow.grand{font-size:17px; font-weight:800; color:var(--primary-dark); border-top:1.5px dashed var(--border); margin-top:6px; padding-top:10px;}

.empty{text-align:center; padding:40px 20px; color:var(--muted);}
.empty .bigic{font-size:44px; margin-bottom:10px;}

/* Modal / sheet */
.overlay{position:fixed; inset:0; background:rgba(34,27,54,0.45); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px; max-height:88vh; overflow-y:auto; animation:slideup .22s ease;}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet h3{margin:0 0 14px; font-size:16.5px; color:var(--primary-dark);}
.sheet .close{position:absolute; right:16px;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#221B36; color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; z-index:400; box-shadow:0 6px 20px rgba(0,0,0,0.25); font-weight:600; max-width:85%; text-align:center;}

.imgupload{width:100%; height:130px; border-radius:14px; border:2px dashed var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer; overflow:hidden; position:relative; background:#FAF9FF;}
.imgupload img{width:100%;height:100%;object-fit:cover; position:absolute; top:0; left:0;}
.imgupload .icbig{font-size:26px; margin-bottom:4px;}

.divider{height:1px; background:var(--border); margin:14px 0;}

.printable{background:#fff; padding:0; font-family:'Segoe UI',Arial,sans-serif; color:#221B36; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
.printable .pbar{background:#5B21B6; height:6px; width:100%;}
.printable .phead{padding:16px 18px 0;}
.printable .plogo{width:56px;height:56px;border-radius:50%;object-fit:cover;float:left;margin-right:12px;}
.printable .pshop{font-size:19px;font-weight:800;color:#5B21B6;margin:2px 0 2px;}
.printable .pmuted{font-size:10.5px;color:#7A7590;line-height:1.5;}
.printable .pline{border:none;border-top:1.4px solid #5B21B6;margin:14px 18px 10px;}
.printable .ptitle{text-align:center;font-size:14px;font-weight:800;color:#FF6B4A;letter-spacing:1px;margin:0 0 12px;}
.printable .pmeta{display:flex;justify-content:space-between;padding:0 18px;font-size:10px;color:#7A7590;margin-bottom:4px;}
.printable .pmeta b{display:block;font-size:12.5px;color:#221B36;font-weight:700;margin-top:2px;}
.printable table{width:calc(100% - 36px); margin:12px 18px 0; border-collapse:collapse;}
.printable thead th{background:#5B21B6;color:#fff;text-align:left;padding:7px 6px;font-size:10.5px;font-weight:700;}
.printable thead th:last-child{text-align:right;}
.printable tbody td{padding:6px;font-size:11px;border-bottom:1px solid #E9E4F5;}
.printable tbody tr:nth-child(even){background:#F5F1FF;}
.printable tbody td:last-child{text-align:right;}
.printable .ptotals{margin:10px 18px 0; padding-top:8px; border-top:1px solid #E9E4F5;}
.printable .trow{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:#221B36;}
.printable .tgrand{background:#FF6B4A;color:#fff;font-weight:800;font-size:13px;padding:7px 8px;border-radius:6px;margin:6px 0;}
.printable .tgood{color:#10B981;font-weight:700;}
.printable .tbad{color:#EF4444;font-weight:700;}
.printable .pfoot{text-align:center;font-size:10px;color:#7A7590;margin:16px 0 10px;}
#printArea{display:none;}
.autoInstallBanner{position:sticky; top:0; z-index:80; display:flex; align-items:center; gap:10px; background:linear-gradient(120deg,var(--primary) 0%,var(--primary-light) 100%); color:#fff; padding:10px 12px; box-shadow:0 4px 14px rgba(91,33,182,0.25);}
.autoInstallBanner img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff;}
.autoInstallBanner .aibText{flex:1;min-width:0;}
.autoInstallBanner .aibTitle{font-size:13px;font-weight:800;line-height:1.2;}
.autoInstallBanner .aibSub{font-size:10.5px;opacity:0.9;line-height:1.3;}
.autoInstallBanner .aibBtn{background:#fff;color:var(--primary);border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:800;flex-shrink:0;}
.autoInstallBanner .aibClose{background:transparent;border:none;color:#fff;font-size:15px;opacity:0.8;padding:4px 2px;flex-shrink:0;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important; position:absolute; top:0; left:0; width:100%;}
}

.actionsheet-item{display:flex; align-items:center; gap:12px; padding:13px 4px; font-weight:700; font-size:14.5px; cursor:pointer; border-bottom:1px solid var(--border);}
.actionsheet-item:last-child{border-bottom:none;}
.actionsheet-item .ic{font-size:20px; width:26px; text-align:center;}

.miniNote{font-size:11.5px; color:var(--muted); background:#F3EEFF; padding:9px 11px; border-radius:10px; margin-bottom:12px; line-height:1.5;}
.ledgerrow{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
.ledgerrow:last-child{border-bottom:none;}

/* ================= AD CATALOG (imported tool, scoped under #ocRoot) ================= */

  :root{
    --maroon:#2b0a35; --maroon-2:#3d1146; --gold:#f2c230; --gold-2:#ffe27a;
    --pink:#e0177d; --red:#e53328; --cream:#fdf8ec; --navy:#191937; --ink:#241428;
    --paper-shadow: 0 18px 50px -12px rgba(43,10,53,.45);
  }
  #ocRoot *{box-sizing:border-box;}
  #ocRoot html, #ocRoot body{margin:0;padding:0;background:#e9e3f5;font-family:'Poppins',sans-serif;color:var(--ink);}

  #ocRoot .toolbar{position:sticky; top:0; z-index:60; background:linear-gradient(90deg,var(--maroon),#4a1355 60%,var(--maroon));
    color:#fff; padding:12px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    box-shadow:0 6px 20px rgba(0,0,0,.25); border-bottom:3px solid var(--gold);}
  #ocRoot .toolbar h1{font-family:'Playfair Display',serif; font-size:17px; margin:0 14px 0 0; color:var(--gold-2); font-weight:800;}
  #ocRoot .grp{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); padding:5px 8px; border-radius:10px;}
  #ocRoot .tbtn{background:var(--gold); color:var(--maroon); border:none; font-weight:700; font-size:13px; padding:8px 13px;
    border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap;}
  #ocRoot .tbtn:hover{filter:brightness(1.05);}
  #ocRoot .tbtn.alt{background:#fff; color:var(--maroon);}
  #ocRoot .tbtn.green{background:#25D366; color:#fff;}
  #ocRoot .switch{position:relative; width:44px; height:24px; display:inline-block;}
  #ocRoot .switch input{opacity:0;width:0;height:0;}
  #ocRoot .slider{position:absolute; cursor:pointer; inset:0; background:#7a5a85; border-radius:24px; transition:.2s;}
  #ocRoot .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  #ocRoot .switch input:checked + .slider{background:var(--gold);}
  #ocRoot .switch input:checked + .slider:before{transform:translateX(20px);}
  #ocRoot .tlabel{font-size:12px; font-weight:600; color:#f1e6ff;}
  #ocRoot .hint{text-align:center; font-size:12.5px; color:#5b3d66; background:#fbe9ff; padding:8px 14px; border-bottom:1px dashed #caa6d6;}
  #ocRoot .hint b{color:var(--pink);}

  #ocRoot .stage{display:flex; justify-content:center; padding:28px 14px 60px;}
  #ocRoot .brochure{width:900px; max-width:100%; background:var(--cream); box-shadow:var(--paper-shadow); position:relative; overflow:hidden; border-radius:6px;}

  #ocRoot .header{background:radial-gradient(circle at 15% 20%, #4a1a58, var(--maroon) 60%); padding:22px 26px 18px;
    display:flex; align-items:center; gap:18px; border-bottom:4px solid var(--gold);}
  #ocRoot .logo-wrap{width:92px;height:92px;border-radius:50%; background:#fff2; border:3px solid var(--gold);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; cursor:pointer; position:relative;}
  #ocRoot .logo-wrap img{width:100%;height:100%;object-fit:cover; display:none;}
  #ocRoot .logo-wrap.has-img img{display:block;}
  #ocRoot .logo-wrap .ph{color:var(--gold-2); font-size:11px; text-align:center; padding:4px; font-weight:600;}
  #ocRoot .shopinfo{flex:1; min-width:0;}
  #ocRoot .shopname{font-family:'Playfair Display',serif; font-weight:900; font-size:34px; color:#fff; line-height:1.05;}
  #ocRoot .shoptag{font-family:'Playfair Display',serif; font-weight:800; font-size:26px; color:var(--gold-2); margin-top:2px;}
  #ocRoot .addr{color:#e9d7f2; font-size:12.5px; margin-top:5px;}
  #ocRoot .phone-line{color:var(--gold-2); font-size:13px; margin-top:5px; font-weight:700;}
  #ocRoot .band{background:linear-gradient(90deg,var(--pink),#ff4fa3); color:#fff; text-align:center; padding:8px; font-weight:800; font-size:14px; letter-spacing:1px;}

  #ocRoot .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:16px;}
  #ocRoot .card{background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 4px 14px rgba(43,10,53,.12); position:relative; border:1px solid #eee2f0;}
  #ocRoot .card-head{background:var(--navy); color:#fff; text-align:center; font-size:11px; font-weight:800; padding:7px 4px; text-transform:uppercase;}
  #ocRoot .card-img{height:120px; background:#f4eef7; position:relative; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#b79bc2; font-size:12px; font-weight:600;}
  #ocRoot .card-img img{width:100%;height:100%;object-fit:cover; display:none; position:absolute; inset:0;}
  #ocRoot .card-img.has-img img{display:block;}
  #ocRoot .card-img.has-img .ph{display:none;}
  #ocRoot .badge{position:absolute; top:0; right:0; background:var(--red); color:#fff; font-weight:900; font-size:12px; padding:6px 8px 5px;
    clip-path:polygon(15% 0,100% 0,100% 100%,0 100%); min-width:40px; text-align:center;}
  #ocRoot .card-price{padding:8px 10px 10px;}
  #ocRoot .mrp-row{font-size:11px; color:#8a7c8f; font-weight:600;}
  #ocRoot .mrp-value{text-decoration:line-through; color:#8a7c8f;}
  #ocRoot .offer-badge{background:var(--red); color:#fff; font-weight:800; font-size:12.5px; padding:4px 8px; border-radius:5px; display:inline-block; margin-top:3px;}
  #ocRoot .offer-lbl{font-size:8px; display:block; font-weight:600; opacity:.85;}
  #ocRoot .brochure.mrp-only .badge{display:none;}
  #ocRoot .brochure.mrp-only .offer-row{display:none;}
  #ocRoot .brochure.mrp-only .mrp-row{font-size:16px; font-weight:800; color:var(--red); margin-top:2px;}

/* ================= DB LAYER ================= */
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('MobiStockDB',2);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('products'))d.createObjectStore('products',{keyPath:'id'});
      if(!d.objectStoreNames.contains('customers'))d.createObjectStore('customers',{keyPath:'id'});
      if(!d.objectStoreNames.contains('invoices'))d.createObjectStore('invoices',{keyPath:'id'});
      if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});
      if(!d.objectStoreNames.contains('purchases'))d.createObjectStore('purchases',{keyPath:'id'});
    };
    req.onsuccess=e=>{db=e.target.result; resolve(db);};
    req.onerror=e=>reject(e);
  });
}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbPut(store,val){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbDelete(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

/* ================= BARCODE SCANNER ================= */
let scannerStream=null;
let scannerRAF=null;
async function openBarcodeScanner(onDetected){
  if(!('BarcodeDetector' in window)){
    openSheet(`<h3>Camera Scanning Not Supported</h3><p style="color:var(--muted);font-size:13.5px;">Your browser doesn't support camera barcode scanning (works best on Chrome for Android). Please type the barcode/SKU manually instead.</p><button class="btn btn-primary btn-block" onclick="closeSheet()">OK</button>`);
    return;
  }
  const overlay=document.createElement('div');
  overlay.className='scannerOverlay';
  overlay.id='scannerOverlay';
  overlay.innerHTML=`
    <div class="scanTopBar"><span class="scanTitle">📷 Scan Barcode</span><button class="scanClose" onclick="closeBarcodeScanner()">✕</button></div>
    <video id="scannerVideo" autoplay playsinline muted></video>
    <div class="scanFrame"></div>
    <div class="scanHint">Point the camera at a barcode — it captures automatically</div>
  `;
  document.body.appendChild(overlay);
  window.__onBarcodeDetected=onDetected;
  try{
    scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=document.getElementById('scannerVideo');
    if(!video){ closeBarcodeScanner(); return; }
    video.srcObject=scannerStream;
    await video.play();
    const detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code','codabar','itf']});
    const scanLoop=async()=>{
      if(!document.getElementById('scannerOverlay'))return;
      try{
        const codes=await detector.detect(video);
        if(codes && codes.length>0){
          const value=codes[0].rawValue;
          const cb=window.__onBarcodeDetected;
          closeBarcodeScanner();
          if(cb) cb(value);
          return;
        }
      }catch(e){}
      scannerRAF=requestAnimationFrame(scanLoop);
    };
    scanLoop();
  }catch(e){
    toast('Camera access denied or unavailable');
    closeBarcodeScanner();
  }
}
function closeBarcodeScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF=null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
  const overlay=document.getElementById('scannerOverlay');
  if(overlay) overlay.remove();
}

/* ================= IMAGE HELPERS ================= */
function compressImage(file,maxW=640,quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w); w=maxW;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function dataURLtoBlob(dataurl){
  const arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]);
  let n=bstr.length; const u8=new Uint8Array(n);
  while(n--){u8[n]=bstr.charCodeAt(n);}
  return new Blob([u8],{type:mime});
}

    <button class="qbtn" style="background:var(--primary)" onclick="openProductForm()"><span class="ic">📦</span>Add Product</button>
    <button class="qbtn" style="background:var(--teal)" onclick="openCustomerForm()"><span class="ic">👤</span>Add Customer</button>

function quickAddProductImage(id){
  const input=document.createElement('input');
  input.type='file'; input.accept='image/*'; input.style.display='none';
  input.onchange=async (e)=>{
    const file=e.target.files[0]; if(!file)return;
    const dataUrl=await compressImage(file);
    const p=PRODUCTS.find(x=>x.id===id) || await dbGet('products',id);
    if(!p)return;
    p.image=dataUrl;
    await dbPut('products',p);
    await refreshData();

    renderInto('products');
  };

/* ================= COLORFUL WHATSAPP AD POSTER ================= */
function loadImageEl(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawImageCover(ctx,img,x,y,w,h){
  const ir=img.width/img.height, tr=w/h;
  let sx,sy,sw,sh;
  if(ir>tr){ sh=img.height; sw=sh*tr; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/tr; sx=0; sy=(img.height-sh)/2; }
  ctx.save();
  roundRectPath(ctx,x,y,w,h,14);
  ctx.clip();
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  ctx.restore();
}
function wrapCanvasText(ctx,text,maxWidth){
  const words=(text||'').split(/\s+/); let lines=[]; let cur='';
  words.forEach(w=>{
    const test=(cur+' '+w).trim();
    if(ctx.measureText(test).width>maxWidth && cur){ lines.push(cur); cur=w; }
    else cur=test;
  });
  if(cur)lines.push(cur);
  return lines;
}
function truncateText(s,n){ return s.length>n? s.substring(0,n-1)+'…' : s; }

async function buildAdFlyerCanvas(ids){
  const items=PRODUCTS.filter(p=>ids.includes(p.id)).slice(0,6);
  const hasLogo=!!SETTINGS.logo;
  const W=1080, H=1350+(hasLogo?90:0);
  const canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');

  // Background gradient (brand colors)
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#5B21B6');
  grad.addColorStop(0.55,'#7C3AED');
  grad.addColorStop(1,'#FF6B4A');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // Decorative translucent circles
  ctx.globalAlpha=0.10; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(950,120,230,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60,1300,200,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;

  // Shop logo (circular, top center, above shop name)
  let nameY=100, tagY=138, offersY=168;
  if(SETTINGS.logo){
    try{
      const logoImg=await loadImageEl(SETTINGS.logo);
      const logoSize=104, logoX=W/2-logoSize/2, logoY=22;
      ctx.save();
      ctx.beginPath(); ctx.arc(W/2,logoY+logoSize/2,logoSize/2+4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(W/2,logoY+logoSize/2,logoSize/2,0,Math.PI*2); ctx.closePath(); ctx.clip();
      ctx.drawImage(logoImg,logoX,logoY,logoSize,logoSize);
      ctx.restore();
      nameY=logoY+logoSize+42; tagY=nameY+38; offersY=tagY+30;
    }catch(e){}
  }

  // Shop name + tagline
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.font='800 60px sans-serif';
  ctx.fillText(truncateText(SETTINGS.shopName||'MY SHOP',22), W/2, nameY);
  ctx.font='600 26px sans-serif';
  ctx.globalAlpha=0.92;
  ctx.fillText('Wholesale Dealer in Glass Bangles', W/2, tagY);
  ctx.globalAlpha=1;

  // Offers ribbon
  ctx.fillStyle='#fff';
  roundRectPath(ctx, W/2-190, offersY, 380, 58, 29); ctx.fill();
  ctx.fillStyle='#5B21B6';
  ctx.font='800 30px sans-serif';
  ctx.fillText('★ OUR PRODUCTS ★', W/2, offersY+38);

  // Product grid
  const cols=2;
  const gridTop=offersY+84, gridLeft=54, gap=18;
  const cardW=(W-gridLeft*2-gap)/cols, cardH=300;
  for(let i=0;i<items.length;i++){
    const p=items[i];
    const col=i%cols, row=Math.floor(i/cols);
    const x=gridLeft+col*(cardW+gap), y=gridTop+row*(cardH+gap);
    ctx.fillStyle='#fff';
    roundRectPath(ctx,x,y,cardW,cardH,18); ctx.fill();
    // image area
    const imgH=170;
    if(p.image){
      try{ const img=await loadImageEl(p.image); drawImageCover(ctx,img,x+16,y+16,cardW-32,imgH); }
      catch(e){ ctx.fillStyle='#EFEAFB'; roundRectPath(ctx,x+16,y+16,cardW-32,imgH,12); ctx.fill(); }
    } else {
      ctx.fillStyle='#EFEAFB'; roundRectPath(ctx,x+16,y+16,cardW-32,imgH,12); ctx.fill();
      ctx.fillStyle='#B9A9E0'; ctx.font='38px sans-serif'; ctx.textAlign='center';
      ctx.fillText('💍', x+cardW/2, y+16+imgH/2+8);
      ctx.fillStyle='#9B8BC4'; ctx.font='600 15px sans-serif';
      ctx.fillText('No Photo', x+cardW/2, y+16+imgH/2+34);
    }
    // name
    ctx.fillStyle='#221B36'; ctx.font='700 24px sans-serif'; ctx.textAlign='center';
    ctx.fillText(truncateText(p.name,20), x+cardW/2, y+imgH+52);
    // price badge (with discount support)
    const hasDiscount = p.discountPrice>0 && p.discountPrice<p.price;
    if(hasDiscount){
      ctx.fillStyle='#9B8BC4'; ctx.font='600 18px sans-serif';
      ctx.fillText(fmt(p.price), x+cardW/2, y+imgH+70);
      const tw=ctx.measureText(fmt(p.price)).width;
      ctx.strokeStyle='#9B8BC4'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(x+cardW/2-tw/2,y+imgH+65); ctx.lineTo(x+cardW/2+tw/2,y+imgH+65); ctx.stroke();
      ctx.fillStyle='#FF6B4A';
      roundRectPath(ctx, x+cardW/2-90, y+imgH+80, 180, 46, 23); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='800 26px sans-serif';
      ctx.fillText(fmt(p.discountPrice), x+cardW/2, y+imgH+111);
    } else {
      ctx.fillStyle='#FF6B4A';
      roundRectPath(ctx, x+cardW/2-85, y+imgH+66, 170, 46, 23); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='800 26px sans-serif';
      ctx.fillText(fmt(p.price), x+cardW/2, y+imgH+97);
    }
  }

  // Footer band
  const footerY=H-150;
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.fillRect(0,footerY,W,150);
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  let fy=footerY+42;
  if(SETTINGS.address){
    ctx.font='600 25px sans-serif';
    const addrLines=wrapCanvasText(ctx,'📍 '+SETTINGS.address,W-80).slice(0,2);
    addrLines.forEach(ln=>{ ctx.fillText(ln, W/2, fy); fy+=34; });
  }
  if(SETTINGS.phone){
    ctx.font='800 30px sans-serif';
    ctx.fillText('📞 '+SETTINGS.phone, W/2, fy+8);
  }

  return canvas;
}

async function saveInvoice(total){
  if(CART.length===0){toast('Cart is empty'); return;}
  const received=parseFloat(document.getElementById('f_received').value)||0;
  const balance=total-received;
  let status='Udhar';
  if(balance<=0)status='Paid'; else if(received>0)status='Partial';
  const invNo=SETTINGS.invoiceCounter||1;
  const inv={
    id:uid(), invoiceNo:invNo, date:Date.now(),
    customerId: billingCustomer? billingCustomer.id : null,
    customerName: billingCustomer? billingCustomer.name : 'Walk-in Customer',
    items:[...CART], subtotal:total, total, received, balance, status
  };
  await dbPut('invoices',inv);
  await saveSetting('invoiceCounter', invNo+1);
  // reduce stock
  for(const ci of CART){
    const p=PRODUCTS.find(x=>x.id===ci.productId);
    if(p){ p.stock = Math.max(0,(p.stock||0)-ci.qty); await dbPut('products',p); }
  }
  // update customer due / ledger
  if(billingCustomer && balance>0){
    const cust=await dbGet('customers', billingCustomer.id);
    if(cust){
      cust.due=(cust.due||0)+balance;
      cust.ledger=cust.ledger||[];
      cust.ledger.push({date:Date.now(), type:'invoice', amount:balance, note:'Invoice #'+invNo, invoiceId:inv.id});
      await dbPut('customers',cust);
    }
  }
  CART=[]; billingCustomer=null; editingInvoiceId=null; window.__editReceivedPrefill=null;
  await refreshData();
  toast('Invoice #'+invNo+' saved ✓');
  goto('invoicedetail', inv.id, true);
}

function editInvoice(id){
  const inv=INVOICES.find(i=>i.id===id);
  if(!inv){toast('Invoice not found'); return;}
  editingInvoiceId=id;
  CART=inv.items.map(it=>({productId:it.productId, name:it.name, price:it.price, qty:it.qty}));
  billingCustomer=inv.customerId? {id:inv.customerId, name:inv.customerName} : null;
  window.__editReceivedPrefill=inv.received;
  goto('newbill');
}
async function updateInvoice(total){
  if(CART.length===0){toast('Cart is empty'); return;}
  const oldInv=INVOICES.find(i=>i.id===editingInvoiceId);
  if(!oldInv){toast('Original invoice not found'); return;}
  const received=parseFloat(document.getElementById('f_received').value)||0;
  const balance=total-received;
  let status='Udhar';
  if(balance<=0)status='Paid'; else if(received>0)status='Partial';

  // Revert old stock deductions
  for(const ci of oldInv.items){
    const p=PRODUCTS.find(x=>x.id===ci.productId);
    if(p){ p.stock=(p.stock||0)+ci.qty; await dbPut('products',p); }
  }
  // Revert old customer due contribution from this invoice
  if(oldInv.customerId && oldInv.balance>0){
    const cust=await dbGet('customers',oldInv.customerId);
    if(cust){
      cust.due=Math.max(0,(cust.due||0)-oldInv.balance);
      cust.ledger=(cust.ledger||[]).filter(l=>l.invoiceId!==oldInv.id);
      await dbPut('customers',cust);
    }
  }

  const updatedInv={
    id:oldInv.id, invoiceNo:oldInv.invoiceNo, date:oldInv.date,
    customerId: billingCustomer? billingCustomer.id : null,
    customerName: billingCustomer? billingCustomer.name : 'Walk-in Customer',
    items:[...CART], subtotal:total, total, received, balance, status, editedAt:Date.now()
  };
  await dbPut('invoices',updatedInv);

  // Apply new stock deductions
  for(const ci of CART){
    const p=PRODUCTS.find(x=>x.id===ci.productId);
    if(p){ p.stock=Math.max(0,(p.stock||0)-ci.qty); await dbPut('products',p); }
  }
  // Apply new customer due
  if(billingCustomer && balance>0){
    const cust=await dbGet('customers', billingCustomer.id);
    if(cust){
      cust.due=(cust.due||0)+balance;
      cust.ledger=cust.ledger||[];
      cust.ledger.push({date:Date.now(), type:'invoice', amount:balance, note:'Invoice #'+updatedInv.invoiceNo+' (edited)', invoiceId:updatedInv.id});
      await dbPut('customers',cust);
    }
  }
  CART=[]; billingCustomer=null; editingInvoiceId=null; window.__editReceivedPrefill=null;
  await refreshData();
  toast('Invoice #'+updatedInv.invoiceNo+' updated ✓');
  goto('invoicedetail', updatedInv.id, true);
}

async function deleteInvoiceApply(id){
  const inv=INVOICES.find(i=>i.id===id);
  if(!inv){closeSheet(); return;}
  for(const ci of inv.items){
    const p=PRODUCTS.find(x=>x.id===ci.productId);
    if(p){ p.stock=(p.stock||0)+ci.qty; await dbPut('products',p); }
  }
  if(inv.customerId && inv.balance>0){
    const cust=await dbGet('customers',inv.customerId);
    if(cust){
      cust.due=Math.max(0,(cust.due||0)-inv.balance);
      cust.ledger=(cust.ledger||[]).filter(l=>l.invoiceId!==inv.id);
      await dbPut('customers',cust);
    }
  }

  toast('Invoice deleted ✓');
  goto('billing', null, true);
}

  const inv=INVOICES.find(i=>i.id===invId);

async function confirmPayment(invId){
  const amt=parseFloat(document.getElementById('payAmt').value)||0;
  if(amt<=0){toast('Enter valid amount'); return;}
  const inv=await dbGet('invoices',invId);
  inv.received=(inv.received||0)+amt;
  inv.balance=Math.max(0,inv.total-inv.received);
  inv.status = inv.balance<=0? 'Paid' : (inv.received>0? 'Partial':'Udhar');
  await dbPut('invoices',inv);
  if(inv.customerId){
    const cust=await dbGet('customers',inv.customerId);
    if(cust){
      cust.due=Math.max(0,(cust.due||0)-amt);
      cust.ledger=cust.ledger||[];
      cust.ledger.push({date:Date.now(), type:'payment', amount:-amt, note:'Payment for Invoice #'+inv.invoiceNo});
      await dbPut('customers',cust);
    }
  }
  await refreshData(); closeSheet(); toast('Payment recorded ✓'); renderInto('invoicedetail',invId);
}

function addToPCart(id){
  const p=PRODUCTS.find(x=>x.id===id); if(!p)return;
  const existing=PCART.find(c=>c.productId===id);
  if(existing)existing.qty+=1;
  else PCART.push({key:uid(), productId:id, name:p.name, qty:1, cost:p.costPrice||0});
  document.getElementById('purchaseSearch').value=''; document.getElementById('purchaseProductResults').innerHTML='';
  renderInto('newpurchase');
}
function addNewPCartItem(name){
  name=(name||'').trim(); if(!name)return;
  PCART.push({key:uid(), productId:null, name, qty:1, cost:0});
  document.getElementById('purchaseSearch').value=''; document.getElementById('purchaseProductResults').innerHTML='';
  renderInto('newpurchase');
}
function handlePurchaseScan(value){
  const p=PRODUCTS.find(x=>x.barcode && x.barcode===value);
  if(p){ addToPCart(p.id); toast('✓ Added: '+p.name); }

function changePCartQty(key,delta){
  const item=PCART.find(c=>c.key===key); if(!item)return;
  item.qty+=delta;
  if(item.qty<=0)PCART=PCART.filter(c=>c.key!==key);
  renderInto('newpurchase');
}
function updatePCartCost(key,val){
  const item=PCART.find(c=>c.key===key); if(!item)return;
  item.cost=parseFloat(val)||0;
  const total=PCART.reduce((s,i)=>s+i.cost*i.qty,0);
  const cartArea=document.getElementById('pCartArea');
  if(cartArea) cartArea.innerHTML = PCART.map(ci=>pCartRowHTML(ci)).join('');
  const grand=document.querySelector('.totalsbox .trow.grand span:last-child');
  if(grand) grand.textContent=fmt(total);
  updatePurchaseBalancePreview(total);
}
function updatePurchaseBalancePreview(total){
  const paidInput=document.getElementById('p_paid');
  const paid=paidInput? (parseFloat(paidInput.value)||0) : 0;
  const bal=total-paid;
  const el=document.getElementById('purchaseBalancePreview');
  if(!el)return;
  if(bal<=0)el.innerHTML=`<span style="color:var(--success);">✓ Fully Paid</span>`;
  else if(paid>0)el.innerHTML=`<span style="color:var(--warning);">Balance Due to Supplier: ${fmt(bal)} (Partial)</span>`;
  else el.innerHTML=`<span style="color:var(--danger);">Full amount due: ${fmt(bal)}</span>`;
}
async function applyPurchaseStock(items, direction){
  // direction: 1 to add stock (new purchase), -1 to revert (edit/delete)
  for(const ci of items){
    if(ci.productId){
      const p=PRODUCTS.find(x=>x.id===ci.productId) || await dbGet('products',ci.productId);
      if(p){
        p.stock=Math.max(0,(p.stock||0)+direction*ci.qty);
        if(direction>0 && ci.cost>0) p.costPrice=ci.cost;
        await dbPut('products',p);
      }
    } else if(direction>0){
      const newProd={id:uid(), name:ci.name, category:'', price:ci.cost>0? Math.round(ci.cost*1.3):0, stock:ci.qty, unit:'pcs', lowStock:5, costPrice:ci.cost, image:'', barcode:'', createdAt:Date.now()};
      await dbPut('products',newProd);
      ci.productId=newProd.id;
    }
  }
}
async function savePurchase(total){
  if(PCART.length===0){toast('Add at least one item'); return;}
  const supplierName=(document.getElementById('p_suppname').value||'').trim() || 'Supplier';
  const supplierPhone=(document.getElementById('p_suppphone').value||'').trim();
  const paid=parseFloat(document.getElementById('p_paid').value)||0;
  const balance=total-paid;
  let status='Udhar';
  if(balance<=0)status='Paid'; else if(paid>0)status='Partial';
  const purchNo=SETTINGS.purchaseCounter||1;
  const items=PCART.map(i=>({...i}));
  const purchase={
    id:uid(), purchaseNo:purchNo, date:Date.now(),
    supplierName, supplierPhone, items, subtotal:total, total, paid, balance, status
  };
  await applyPurchaseStock(items, 1);
  purchase.items=items;
  await dbPut('purchases',purchase);
  await saveSetting('purchaseCounter', purchNo+1);
  PCART=[]; purchaseSupplier=''; purchaseSupplierPhone=''; editingPurchaseId=null; window.__editPurchasePaidPrefill=null;
  await refreshData();
  toast('Purchase #'+purchNo+' saved ✓');
  goto('purchasedetail', purchase.id, true);
}
function editPurchase(id){
  const p=PURCHASES.find(x=>x.id===id);
  if(!p){toast('Purchase not found'); return;}
  editingPurchaseId=id;
  PCART=p.items.map(it=>({key:uid(), productId:it.productId, name:it.name, qty:it.qty, cost:it.cost}));
  purchaseSupplier=p.supplierName||''; purchaseSupplierPhone=p.supplierPhone||'';
  window.__editPurchasePaidPrefill=p.paid;
  goto('newpurchase');
}
async function updatePurchase(total){
  if(PCART.length===0){toast('Add at least one item'); return;}
  const oldP=PURCHASES.find(x=>x.id===editingPurchaseId);
  if(!oldP){toast('Original purchase not found'); return;}
  const supplierName=(document.getElementById('p_suppname').value||'').trim() || 'Supplier';
  const supplierPhone=(document.getElementById('p_suppphone').value||'').trim();
  const paid=parseFloat(document.getElementById('p_paid').value)||0;
  const balance=total-paid;
  let status='Udhar';
  if(balance<=0)status='Paid'; else if(paid>0)status='Partial';

  await applyPurchaseStock(oldP.items, -1); // revert old stock additions
  const items=PCART.map(i=>({...i}));
  await applyPurchaseStock(items, 1); // apply new stock additions

  const updatedP={
    id:oldP.id, purchaseNo:oldP.purchaseNo, date:oldP.date,
    supplierName, supplierPhone, items, subtotal:total, total, paid, balance, status, editedAt:Date.now()
  };
  await dbPut('purchases',updatedP);
  PCART=[]; purchaseSupplier=''; purchaseSupplierPhone=''; editingPurchaseId=null; window.__editPurchasePaidPrefill=null;
  await refreshData();
  toast('Purchase #'+updatedP.purchaseNo+' updated ✓');
  goto('purchasedetail', updatedP.id, true);
}

async function confirmPurchasePayment(id){
  const amt=parseFloat(document.getElementById('ppayAmt').value)||0;
  if(amt<=0){toast('Enter valid amount'); return;}
  const p=await dbGet('purchases',id);
  p.paid=(p.paid||0)+amt;
  p.balance=Math.max(0,p.total-p.paid);
  p.status = p.balance<=0? 'Paid' : (p.paid>0? 'Partial':'Udhar');
  await dbPut('purchases',p);
  await refreshData(); closeSheet(); toast('Payment recorded ✓'); renderInto('purchasedetail',id);

let reportRange='today';
let customFromDate='';
let customToDate='';
function getReportDateRange(){
  const now=new Date();
  let from, to=now.getTime(), label;
  if(reportRange==='today'){from=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(); label='Today';}
  else if(reportRange==='week'){from=now.getTime()-7*86400000; label='Last 7 Days';}
  else if(reportRange==='month'){from=new Date(now.getFullYear(),now.getMonth(),1).getTime(); label='This Month';}
  else {
    from = customFromDate? new Date(customFromDate+'T00:00:00').getTime() : new Date(now.getFullYear(),now.getMonth(),1).getTime();
    to = customToDate? new Date(customToDate+'T23:59:59').getTime() : now.getTime();
    label = (customFromDate? fmtDate(from):'…') + ' to ' + (customToDate? fmtDate(to):'…');
  }
  return {from, to, label};
}

function generateSalesReportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  setupPdfFonts(doc);
  const {from, to, label:rangeLabel}=getReportDateRange();
  const inRange=[...INVOICES.filter(i=>i.date>=from && i.date<=to)].sort((a,b)=>a.date-b.date);
  const totalSales=inRange.reduce((s,i)=>s+i.total,0);
  const totalCollected=inRange.reduce((s,i)=>s+i.received,0);
  const totalUdhar=inRange.reduce((s,i)=>s+i.balance,0);

  doc.setFontSize(16); doc.setTextColor(91,33,182);
  doc.text(SETTINGS.shopName||'My Shop', 14, 16);
  doc.setFontSize(9); doc.setTextColor(120,120,120);
  doc.text(SETTINGS.address||'', 14, 22);
  doc.setFontSize(13); doc.setTextColor(30,20,50);
  doc.text('Sales Report — '+rangeLabel, 14, 33);
  doc.setFontSize(9); doc.setTextColor(120,120,120);
  doc.text('Generated: '+fmtDateTime(Date.now()), 14, 39);

  let y=50;
  doc.setFontSize(10); doc.setTextColor(30,20,50);
  doc.text('Total Sales: '+pdfMoney(totalSales), 14, y);
  doc.text('Collected: '+pdfMoney(totalCollected), 85, y);
  doc.text('Pending: '+pdfMoney(totalUdhar), 150, y);
  y+=7;
  doc.text('Total Invoices: '+inRange.length, 14, y);
  y+=8;
  doc.setDrawColor(200,200,200); doc.line(14,y,196,y); y+=7;

  doc.setFontSize(10); doc.setTextColor(90,90,90);
  doc.text('Inv#',14,y); doc.text('Date',38,y); doc.text('Customer',75,y); doc.text('Amount',150,y); doc.text('Status',175,y);
  y+=4; doc.line(14,y,196,y); y+=6;
  doc.setTextColor(30,20,50); doc.setFontSize(9.5);
  if(!inRange.length){ doc.text('No invoices in this period.',14,y); y+=7; }
  inRange.forEach(inv=>{
    if(y>280){ doc.addPage(); y=20; }
    doc.text('#'+inv.invoiceNo,14,y);
    doc.text(fmtDate(inv.date),38,y);
    doc.text((inv.customerName||'Walk-in').substring(0,26),75,y);
    doc.text(pdfMoney(inv.total),150,y);
    doc.text(inv.status,175,y);
    y+=7;
  });
  y+=3; doc.setDrawColor(150,150,150); doc.line(14,y,196,y); y+=8;
  doc.setFontSize(11); doc.setTextColor(91,33,182);
  doc.text('Grand Total: '+pdfMoney(totalSales), 14, y);
  doc.save('Sales_Report_'+rangeLabel.replace(/\s+/g,'_')+'.pdf');
  toast('Sales report downloaded ✓');
}

function generateCategoryReportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  setupPdfFonts(doc);
  doc.setFontSize(16); doc.setTextColor(91,33,182);
  doc.text(SETTINGS.shopName||'My Shop', 14, 16);
  doc.setFontSize(13); doc.setTextColor(30,20,50);
  doc.text('Category-wise Stock Report', 14, 28);
  doc.setFontSize(9); doc.setTextColor(120,120,120);
  doc.text('Generated: '+fmtDateTime(Date.now()), 14, 34);

  const categories={};
  PRODUCTS.forEach(p=>{
    const cat=p.category||'Uncategorized';
    if(!categories[cat]) categories[cat]=[];
    categories[cat].push(p);
  });
  let y=46, grandValue=0;
  const catNames=Object.keys(categories).sort();
  if(!catNames.length){ doc.setFontSize(10); doc.setTextColor(90,90,90); doc.text('No products added yet.',14,y); }
  catNames.forEach(cat=>{
    if(y>265){doc.addPage(); y=20;}
    const items=categories[cat];
    const catValue=items.reduce((s,p)=>s+p.price*p.stock,0);
    const catQty=items.reduce((s,p)=>s+p.stock,0);
    grandValue+=catValue;
    doc.setFontSize(11.5); doc.setTextColor(91,33,182);
    doc.text(cat+' ('+items.length+' products)', 14, y); y+=6;
    doc.setFontSize(9); doc.setTextColor(90,90,90);
    doc.text('Product',16,y); doc.text('Price',128,y); doc.text('Stock',155,y); doc.text('Value',177,y);
    y+=4; doc.setDrawColor(230,230,230); doc.line(14,y,196,y); y+=5;
    doc.setTextColor(30,20,50); doc.setFontSize(9.5);
    items.forEach(p=>{
      if(y>280){doc.addPage(); y=20;}
      doc.text(p.name.substring(0,44),16,y);
      doc.text(pdfMoney(p.price),128,y);
      doc.text(String(p.stock)+' '+(p.unit||''),155,y);
      doc.text(pdfMoney(p.price*p.stock),177,y);
      y+=6;
    });
    y+=2;
    doc.setFontSize(9.5); doc.setTextColor(91,33,182);
    doc.text('Subtotal: '+pdfMoney(catValue)+' ('+catQty+' units)', 16, y); y+=11;
  });
  if(catNames.length){
    if(y>270){doc.addPage(); y=20;}
    doc.setDrawColor(150,150,150); doc.line(14,y,196,y); y+=8;
    doc.setFontSize(12); doc.setTextColor(91,33,182);
    doc.text('Grand Total Stock Value: '+pdfMoney(grandValue), 14, y);
  }
  doc.save('Category_Stock_Report.pdf');
  toast('Category report downloaded ✓');
}

  const dataUrl=await compressImage(file,300,0.75);
  await saveSetting('logo',dataUrl);
  toast('Logo updated'); renderInto('settings');
}
async function saveShopSettings(){

  await saveSetting('phone',document.getElementById('s_phone').value.trim());
  await saveSetting('address',document.getElementById('s_addr').value.trim());
  await saveSetting('gst',document.getElementById('s_gst').value.trim());
  await saveSetting('currency',document.getElementById('s_cur').value.trim()||'₹');

async function exportBackup(){
  const data={products:PRODUCTS, customers:CUSTOMERS, invoices:INVOICES, purchases:PURCHASES, settings:SETTINGS, exportedAt:Date.now()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='AshaBangles_Backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('Backup downloaded ✓');
}
async function importBackup(e){
  const file=e.target.files[0]; if(!file)return;
  const text=await file.text();
  try{
    const data=JSON.parse(text);
    for(const p of (data.products||[]))await dbPut('products',p);
    for(const c of (data.customers||[]))await dbPut('customers',c);
    for(const i of (data.invoices||[]))await dbPut('invoices',i);
    for(const pu of (data.purchases||[]))await dbPut('purchases',pu);
    if(data.settings){for(const k in data.settings){await saveSetting(k,data.settings[k]);}}
    await refreshData(); await loadSettings();
    toast('Backup restored ✓'); render();
  }catch(err){toast('Invalid backup file');}
}

/* ================= DAILY AUTO BACKUP ================= */
let AUTO_BACKUPS=[];
async function refreshAutoBackups(){
  const rows=await dbGetAll('settings');
  AUTO_BACKUPS = rows.filter(r=>r.key && r.key.startsWith('autobackup_')).sort((a,b)=>b.key.localeCompare(a.key));
}
function renderAutoBackupListHTML(){
  if(!AUTO_BACKUPS.length) return `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:8px;">No auto-backups yet — one will be created automatically today.</div>`;
  return AUTO_BACKUPS.map(r=>{
    const dateStr=r.key.replace('autobackup_','');
    return `<div class="ledgerrow"><span>📦 ${dateStr}</span><span style="display:flex;gap:8px;"><button class="iconsm" onclick="downloadAutoBackup('${r.key}')">⬇️</button><button class="iconsm" onclick="restoreAutoBackupConfirm('${r.key}')">↩️</button></span></div>`;
  }).join('');
}
async function downloadAutoBackup(key){
  const row=await dbGet('settings',key); if(!row)return;
  const blob=new Blob([row.value],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=key+'.json'; a.click();
  toast('Backup downloaded ✓');
}
function restoreAutoBackupConfirm(key){
  const dateStr=key.replace('autobackup_','');
  openSheet(`<h3>Restore ${dateStr} backup?</h3><p style="color:var(--muted);font-size:13.5px;">This will overwrite your current products, customers and invoices with this backup's data.</p>
  <button class="btn btn-primary btn-block" onclick="restoreAutoBackupApply('${key}')">Restore This Backup</button>
  <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>`);
}
async function restoreAutoBackupApply(key){
  const row=await dbGet('settings',key); if(!row){closeSheet(); return;}
  try{
    const data=JSON.parse(row.value);
    for(const p of (data.products||[]))await dbPut('products',p);
    for(const c of (data.customers||[]))await dbPut('customers',c);
    for(const i of (data.invoices||[]))await dbPut('invoices',i);
    for(const pu of (data.purchases||[]))await dbPut('purchases',pu);
    await refreshData();
    closeSheet(); toast('Restored ✓'); render();
  }catch(e){ closeSheet(); toast('Could not restore this backup'); }
}
async function runDailyAutoBackup(){
  try{
    if(SETTINGS.autoBackupEnabled===false) return;
    if(!PRODUCTS.length && !CUSTOMERS.length && !INVOICES.length) return;
    const todayKey='autobackup_'+new Date().toISOString().slice(0,10);
    const existing=await dbGet('settings',todayKey).catch(()=>null);
    if(existing) return;
    const data={products:PRODUCTS, customers:CUSTOMERS, invoices:INVOICES, purchases:PURCHASES, settings:SETTINGS, savedAt:Date.now()};
    await dbPut('settings',{key:todayKey, value:JSON.stringify(data)});
    const allKeys=(await dbGetAll('settings')).filter(r=>r.key.startsWith('autobackup_')).map(r=>r.key).sort();
    while(allKeys.length>7){ const old=allKeys.shift(); await dbDelete('settings',old); }
    try{
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='AshaBangles_AutoBackup_'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){}
    await refreshAutoBackups();
    toast('📦 Daily auto-backup saved ✓');
  }catch(e){}
}
function resetDataConfirm(){
  openSheet(`<h3>Reset All Data?</h3><p style="color:var(--danger);font-size:13.5px;font-weight:700;">This will permanently delete all products, customers and invoices on this device. This cannot be undone.</p>
  <button class="btn btn-danger btn-block" onclick="resetAllData()">Yes, Delete Everything</button>
  <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>`);
}
async function resetAllData(){
  for(const store of ['products','customers','invoices','purchases']){
    const rows=await dbGetAll(store);
    for(const r of rows)await dbDelete(store,r.id);
  }
  await refreshData(); closeSheet(); toast('All data cleared'); goto('dashboard',null,true);
}

/* ================= BLUETOOTH PRINTING ================= */
let btDevice=null, btChar=null;
const PRINTER_PROFILES=[
  {service:'000018f0-0000-1000-8000-00805f9b34fb', char:'00002af1-0000-1000-8000-00805f9b34fb'},
  {service:'0000ff00-0000-1000-8000-00805f9b34fb', char:'0000ff02-0000-1000-8000-00805f9b34fb'},
  {service:'49535343-fe7d-4ae5-8fa9-9fafd205e455', char:'49535343-8841-43f4-a8d4-ecbe34729bb3'},
];
async function connectPrinter(){
  if(!navigator.bluetooth){toast('Bluetooth not supported in this browser'); return;}
  try{
    btDevice=await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:PRINTER_PROFILES.map(p=>p.service)});
    const server=await btDevice.gatt.connect();
    let found=false;
    for(const prof of PRINTER_PROFILES){
      try{
        const service=await server.getPrimaryService(prof.service);
        const ch=await service.getCharacteristic(prof.char);
        btChar=ch; found=true; break;
      }catch(e){}
    }
    if(!found){toast('Connected, but printer profile not recognized. Try "Print" (system dialog) instead.');}
    else toast('Printer connected: '+btDevice.name);
    render();
  }catch(e){toast('Could not connect: '+(e.message||'try again'));}
}
async function connectAndPrint(invId){
  await connectPrinter();
  if(btChar){ await printInvoiceBluetooth(invId); }
}
async function btWrite(bytes){
  const chunk=180;
  for(let i=0;i<bytes.length;i+=chunk){
    await btChar.writeValue(bytes.slice(i,i+chunk));
    await new Promise(r=>setTimeout(r,40));
  }
}
function buildReceiptLines(inv){
  const W=SETTINGS.paperWidth||32;
  let lines=[];
  lines.push({text:center(SETTINGS.shopName||'MY SHOP',W), bold:true});
  if(SETTINGS.address) wrapText(SETTINGS.address,W).forEach(ln=>lines.push({text:center(ln,W)}));
  if(SETTINGS.phone)lines.push({text:center(SETTINGS.phone,W)});
  lines.push({text:'-'.repeat(W)});
  lines.push({text:'Invoice #'+inv.invoiceNo});
  lines.push({text:new Date(inv.date).toLocaleString('en-IN')});
  lines.push({text:'Customer: '+(inv.customerName||'Walk-in')});
  lines.push({text:'-'.repeat(W)});
  inv.items.forEach((it,idx)=>{
    const sn=(idx+1)+'. ';
    lines.push({text:(sn+it.name).substring(0,W-2)});
    lines.push({text:`   ${it.qty} x ${it.price} = Rs.${(it.qty*it.price).toFixed(2)}`});
  });
  lines.push({text:'-'.repeat(W)});
  lines.push({text:'Subtotal: Rs.'+inv.subtotal.toFixed(2)});
  lines.push({text:'+'+'-'.repeat(W-2)+'+'});
  lines.push({text:center('TOTAL: Rs.'+inv.total.toFixed(2),W), bold:true, tall:true});
  lines.push({text:'+'+'-'.repeat(W-2)+'+'});
  lines.push({text:'Received: Rs.'+inv.received.toFixed(2)});
  lines.push({text:'Balance: Rs.'+inv.balance.toFixed(2)});
  lines.push({text:'-'.repeat(W)});
  lines.push({text:center('Thank you! Visit again',W)});
  return lines;
}
function wrapText(s,width){
  const words=(s||'').split(/\s+/); let lines=[]; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length>width){ if(cur)lines.push(cur.trim()); cur=w; }
    else cur=(cur+' '+w).trim();
  });
  if(cur)lines.push(cur.trim());
  return lines;
}
function center(s,w){ w=w||SETTINGS.paperWidth||32; const pad=Math.max(0,Math.floor((w-s.length)/2)); return ' '.repeat(pad)+s; }
const CUT_COMMANDS={
  'GSVB0':[0x1D,0x56,0x42,0x00],
  'GSV0':[0x1D,0x56,0x00],
  'GSV1':[0x1D,0x56,0x01],
  'ESCi':[0x1B,0x69],
  'ESCm':[0x1B,0x6D],
};
let ESCPOS_LOGO_CACHE=null; // {key, bytes}
async function getLogoEscposBytes(){
  if(!SETTINGS.logo) return null;
  const paperPx = (SETTINGS.paperWidth||32) <= 32 ? 384 : 576;
  const widthPx = Math.round(paperPx * 0.4); // keep the logo modest — roughly 40% of paper width, centered
  const cacheKey = SETTINGS.logo.length+'_'+widthPx;
  if(ESCPOS_LOGO_CACHE && ESCPOS_LOGO_CACHE.key===cacheKey) return ESCPOS_LOGO_CACHE.bytes;
  try{
    const img = await new Promise((resolve,reject)=>{
      const im=new Image();
      im.onload=()=>resolve(im);
      im.onerror=reject;
      im.src=SETTINGS.logo;
    });
    const scale = widthPx/img.width;
    const h = Math.max(1, Math.round(img.height*scale));
    const canvas=document.createElement('canvas');
    canvas.width=widthPx; canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,widthPx,h);
    ctx.drawImage(img,0,0,widthPx,h);
    const imgData=ctx.getImageData(0,0,widthPx,h).data;
    const bytesPerRow=Math.ceil(widthPx/8);
    const bitmap=new Uint8Array(bytesPerRow*h);
    for(let y=0;y<h;y++){
      for(let x=0;x<widthPx;x++){
        const idx=(y*widthPx+x)*4;
        const r=imgData[idx], g=imgData[idx+1], b=imgData[idx+2], a=imgData[idx+3];
        const lum = a<128? 255 : (0.299*r+0.587*g+0.114*b);
        if(lum<180){
          const byteIdx=y*bytesPerRow + (x>>3);
          bitmap[byteIdx] |= (0x80 >> (x&7));
        }
      }
    }
    const bpr=bytesPerRow;
    const header=new Uint8Array([0x1D,0x76,0x30,0x00, bpr&0xFF,(bpr>>8)&0xFF, h&0xFF,(h>>8)&0xFF]);
    const out=new Uint8Array(header.length+bitmap.length);
    out.set(header,0); out.set(bitmap,header.length);
    ESCPOS_LOGO_CACHE={key:cacheKey, bytes:out};
    return out;
  }catch(e){ return null; }
}
function buildEscposReceipt(lines, logoBytes){
  const encoder=new TextEncoder();
  const parts=[new Uint8Array([0x1B,0x40])]; // ESC @ initialize
  if(logoBytes && logoBytes.length){
    parts.push(new Uint8Array([0x1B,0x61,0x01])); // center align for logo
    parts.push(logoBytes);
    parts.push(encoder.encode('\n'));
    parts.push(new Uint8Array([0x1B,0x61,0x00])); // left align for the rest
  }
  lines.forEach(ln=>{
    if(ln.bold) parts.push(new Uint8Array([0x1B,0x45,0x01])); // bold ON
    parts.push(new Uint8Array([0x1D,0x21, ln.tall?0x01:0x00])); // double-height on/off
    parts.push(encoder.encode(ln.text+'\n'));
    parts.push(new Uint8Array([0x1D,0x21,0x00])); // size reset
    if(ln.bold) parts.push(new Uint8Array([0x1B,0x45,0x00])); // bold OFF
  });
  parts.push(encoder.encode('\n\n\n'));
  const cutCode=CUT_COMMANDS[SETTINGS.cutCommand]||CUT_COMMANDS['GSVB0'];
  parts.push(new Uint8Array(cutCode));
  let total=0; parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total); let off=0;
  parts.forEach(p=>{ out.set(p,off); off+=p.length; });
  return out;
}
async function printInvoiceBluetooth(id){
  if(!btChar){toast('Connect a Bluetooth printer first in Settings'); return;}
  const inv=INVOICES.find(i=>i.id===id);
  const lines=buildReceiptLines(inv);
  const logoBytes=await getLogoEscposBytes();
  const bytes=buildEscposReceipt(lines, logoBytes);
  try{ await btWrite(bytes); toast('Printing & cutting...'); }catch(e){ toast('Print failed: '+(e.message||'')); }
}

/* ================= SYSTEM PRINT ================= */
function printInvoiceSystem(id){
  const inv=INVOICES.find(i=>i.id===id);
  const html=`
  <div class="printable">
    <div class="pbar"></div>
    <div class="phead">
      ${SETTINGS.logo? `<img class="plogo" src="${SETTINGS.logo}">`:''}
      <div class="pshop">${escHtml(SETTINGS.shopName||'My Shop')}</div>
      <div class="pmuted">${escHtml(SETTINGS.address||'')}${SETTINGS.phone? ' · '+escHtml(SETTINGS.phone):''}</div>
      <div style="clear:both;"></div>
    </div>
    <hr class="pline">
    <div class="ptitle">TAX INVOICE</div>
    <div class="pmeta">
      <div>BILL TO<b>${escHtml(inv.customerName||'Walk-in Customer')}</b></div>
      <div style="text-align:right;">INVOICE #${inv.invoiceNo}<b>${fmtDate(inv.date)}</b></div>
    </div>
    <table>
      <thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
      <tbody>${inv.items.map((it,idx)=>`<tr><td>${idx+1}</td><td>${escHtml(it.name)}</td><td>${it.qty}</td><td>${fmt(it.price)}</td><td>${fmt(it.qty*it.price)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="ptotals">
      <div class="trow"><span>Subtotal</span><span>${fmt(inv.subtotal)}</span></div>
      <div class="trow tgrand"><span>TOTAL</span><span>${fmt(inv.total)}</span></div>
      <div class="trow"><span>Received</span><span>${fmt(inv.received)}</span></div>
      <div class="trow"><span>Balance</span><span class="${inv.balance>0?'tbad':'tgood'}">${fmt(inv.balance)}</span></div>
    </div>
    <div class="pfoot">Thank you for your business! · Visit again</div>
  </div>`;
  document.getElementById('printArea').innerHTML=html;
  const logoImg=document.querySelector('#printArea .plogo');
  if(logoImg && !logoImg.complete){
    let done=false;
    const go=()=>{ if(done)return; done=true; window.print(); };
    logoImg.addEventListener('load',go);
    logoImg.addEventListener('error',go);
    setTimeout(go,600); // safety fallback in case load/error never fire
  } else {
    window.print();
  }
}

function setupPdfFonts(doc){
  doc.addFileToVFS('DejaVuSans.ttf', PDF_FONT_REGULAR_B64);
  doc.addFont('DejaVuSans.ttf', 'DejaVuSans', 'normal');
  doc.addFileToVFS('DejaVuSans-Bold.ttf', PDF_FONT_BOLD_B64);
  doc.addFont('DejaVuSans-Bold.ttf', 'DejaVuSans', 'bold');
  doc.setFont('DejaVuSans','normal');
}

/* ================= PDF HELPERS ================= */
function pdfMoney(n){ return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function numberToWordsIndian(num){
  num=Math.round(num);
  if(num===0) return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)]+(n%10? ' '+ones[n%10]:''); }
  function threeDigits(n){ let str=''; if(n>=100){ str+=ones[Math.floor(n/100)]+' Hundred'; n=n%100; if(n)str+=' '; } if(n>0) str+=twoDigits(n); return str; }
  let crore=Math.floor(num/10000000); num%=10000000;
  let lakh=Math.floor(num/100000); num%=100000;
  let thousand=Math.floor(num/1000); num%=1000;
  let rest=num;
  let parts=[];
  if(crore) parts.push(threeDigits(crore)+' Crore');
  if(lakh) parts.push(threeDigits(lakh)+' Lakh');
  if(thousand) parts.push(threeDigits(thousand)+' Thousand');
  if(rest) parts.push(threeDigits(rest));
  return parts.length? parts.join(' ') : 'Zero';
}
function amountInWords(total){
  const rupees=Math.floor(total);
  const paise=Math.round((total-rupees)*100);
  let words=numberToWordsIndian(rupees)+' Rupees';
  if(paise>0) words+=' and '+numberToWordsIndian(paise)+' Paise';
  words+=' Only';
  return words;
}

  doc.line(148,y,196,y);
  y+=5;
  doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  doc.text('Authorized Signatory', 196, y, {align:'right'});

  const blob=doc.output('blob');
  const file=new File([blob],'Invoice_'+inv.invoiceNo+'.pdf',{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Invoice #'+inv.invoiceNo, text:'Invoice from '+(SETTINGS.shopName||'My Shop')}); return; }catch(e){}
  }
  doc.save(file.name);
  toast('PDF downloaded — share via WhatsApp manually');
}

async function ocInitScreen(){

  try{ const rec=await dbGet('settings','adCatalogHTML'); saved=rec?rec.value:null; }catch(e){}
  if(saved){
    const old=document.getElementById('brochure');
    if(old) old.outerHTML=saved;
  } else {
    oc_renderDefault();
  }
  const nameEl=document.getElementById('shopName');
  if(nameEl) nameEl.textContent = SETTINGS.shopName || 'MY SHOP';
  const logoImg=document.getElementById('logoImg');
  const logoWrap=document.querySelector('#ocRoot .logo-wrap');
  if(logoImg){
    if(SETTINGS.logo){ logoImg.src=SETTINGS.logo; if(logoWrap) logoWrap.classList.add('has-img'); }
    else if(logoWrap){ logoWrap.classList.remove('has-img'); }
  }
  if(!saved){
    const addrEl=document.getElementById('shopAddr'); if(addrEl && SETTINGS.address) addrEl.textContent='📍 '+SETTINGS.address;
    const phoneEl=document.getElementById('shopPhone'); if(phoneEl && SETTINGS.phone) phoneEl.textContent=SETTINGS.phone;
    const tagEl=document.getElementById('shopTag'); if(tagEl) tagEl.textContent='WHOLESALE DEALER IN GLASS BANGLES';
  }
  const brochure=document.getElementById('brochure');
  if(brochure){
    let saveTimer=null;
    const scheduleSave=()=>{
      clearTimeout(saveTimer);
      saveTimer=setTimeout(async ()=>{
        const b=document.getElementById('brochure');
        if(b){ try{ await saveSetting('adCatalogHTML', b.outerHTML); }catch(e){} }
        oc_syncCatalogToBackend();
      }, 800);
    };
    brochure.addEventListener('input', scheduleSave);
    brochure.addEventListener('change', scheduleSave);
    brochure.addEventListener('click', (e)=>{ if(e.target.closest('.card-del') || e.target.closest('.card-img')) scheduleSave(); });
    new MutationObserver(scheduleSave).observe(brochure,{childList:true,subtree:true});
  }
}

  var action = e.parameter.action;

  if (action === 'getCatalog') {
    var catSheet = getCatalogSheet();
    var json = catSheet.getRange(1, 1).getValue() || '';
    return ContentService.createTextOutput(json || '{}')
      .setMimeType(ContentService.MimeType.JSON);
  }

  var sheet = getOrdersSheet();

  if (action === 'updateStatus') {
    var orderId = e.parameter.orderId;
    var status = e.parameter.status;
    var data = sheet.getDataRange().getValues();
    for (var i = 1; i < data.length; i++) {
      if (String(data[i][0]) === orderId) {
        sheet.getRange(i + 1, 7).setValue(status);
        break;
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ success: true }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  var data = sheet.getDataRange().getValues();
  var orders = [];
  for (var i = data.length - 1; i >= 1; i--) {
    orders.push({
      orderId: data[i][0],
      timestamp: data[i][1],
      customerName: data[i][2],
      phone: data[i][3],
      items: data[i][4],
      total: data[i][5],
      status: data[i][6] || 'Pending'
    });
  }
  return ContentService.createTextOutput(JSON.stringify({ orders: orders }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var action = e.parameter.action;

  if (action === 'saveCatalog') {
    var catSheet = getCatalogSheet();
    catSheet.getRange(1, 1).setValue(e.postData.contents);
    return ContentService.createTextOutput(JSON.stringify({ success: true }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  var sheet = getOrdersSheet();
  var data = JSON.parse(e.postData.contents);
  var orderId = 'ORD' + new Date().getTime();
  sheet.appendRow([
    orderId,
    new Date().toISOString(),
    data.customerName || '',
    data.phone || '',
    data.items || '',
    data.total || 0,
    'Pending'
  ]);
  return ContentService.createTextOutput(JSON.stringify({ success: true, orderId: orderId }))
    .setMimeType(ContentService.MimeType.JSON);
}

function getCatalogSheet() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Catalog');
  if (!sheet) {
    sheet = ss.insertSheet('Catalog');
    sheet.getRange(1, 1).setValue('{}');
  }
  return sheet;
}

function getOrdersSheet() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Orders');
  if (!sheet) {
    sheet = ss.insertSheet('Orders');
    sheet.appendRow(['Order ID', 'Timestamp', 'Customer Name', 'Phone', 'Items', 'Total', 'Status']);
  }
  return sheet;
}`;

let oc_REPORT_RANGE = 'today';
function oc_getReportRangeBounds(range){
  const now = new Date();
  let from;
  if(range==='today'){ from = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(); }
  else if(range==='week'){ from = now.getTime() - 7*24*60*60*1000; }
  else if(range==='month'){ from = new Date(now.getFullYear(), now.getMonth(), 1).getTime(); }
  else { from = 0; }
  return { from, to: now.getTime() };
}
function oc_setReportRange(range, btn){
  oc_REPORT_RANGE = range;
  document.querySelectorAll('#rfilters button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  oc_renderReport();
}
function oc_renderReport(){
  const {from, to} = oc_getReportRangeBounds(oc_REPORT_RANGE);
  const inRange = oc_ORDERS.filter(o=>{
    const ts = o.timestamp ? new Date(o.timestamp).getTime() : 0;
    return ts>=from && ts<=to;
  });
  const active = inRange.filter(o=>o.status!=='Deleted');
  const pending = active.filter(o=>o.status!=='Completed').length;
  const completed = active.filter(o=>o.status==='Completed').length;
  const deletedCount = inRange.length - active.length;
  const totalRs = active.reduce((a,b)=>a+(Number(b.total)||0),0);
  document.getElementById('rstats').innerHTML = `
    <div class="dstat"><div class="n">${inRange.length}</div><div class="l">మొత్తం ఆర్డర్లు</div></div>
    <div class="dstat"><div class="n">${pending}</div><div class="l">Pending</div></div>
    <div class="dstat"><div class="n">${completed}</div><div class="l">Completed</div></div>
    <div class="dstat"><div class="n">₹${totalRs}</div><div class="l">మొత్తం Value</div></div>
    <div class="dstat"><div class="n">${deletedCount}</div><div class="l">Deleted</div></div>
  `;
  const list = document.getElementById('rlist');
  if(inRange.length===0){
    list.innerHTML = '<div class="dempty"><div class="big">📭</div>ఈ కాలంలో ఆర్డర్లు లేవు</div>';
    return;
  }
  list.innerHTML = [...inRange].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(o=>{
    const status = o.status || 'Pending';
    const isDeleted = status === 'Deleted';
    const t = o.timestamp ? new Date(o.timestamp).toLocaleString('en-IN') : '';
    return `<div class="dorder">
      <div class="drow">
        <div>
          <div class="doid">#${o.orderId} • ${t}</div>
          <div class="dname">${o.customerName || '-'}</div>
        </div>
        <div class="dtotal">₹${o.total}</div>
      </div>
      <div class="ditems">${o.items || ''}</div>
      <span class="dpill ${status}">${isDeleted?'🗑️ Deleted': status==='Completed' ? '✅ Completed' : '🕒 Pending'}</span>
    </div>`;
  }).join('');
}
function oc_downloadReportPDF(){
  if(!window.jspdf){ alert('PDF library లోడ్ కాలేదు, ఇంటర్నెట్ కనెక్షన్ చెక్ చేసి మళ్ళీ ప్రయత్నించండి'); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  const {from, to} = oc_getReportRangeBounds(oc_REPORT_RANGE);
  const inRange = oc_ORDERS.filter(o=>{ const ts=o.timestamp? new Date(o.timestamp).getTime():0; return ts>=from && ts<=to; });
  const active = inRange.filter(o=>o.status!=='Deleted');
  const totalRs = active.reduce((a,b)=>a+(Number(b.total)||0),0);
  const rangeLabel = {today:'Today', week:'This Week', month:'This Month', all:'All Time'}[oc_REPORT_RANGE] || 'All Time';

  doc.setFillColor(43,10,53); doc.rect(0,0,210,30,'F');
  let hx=16;
  if(SETTINGS.logo){ try{ doc.addImage(SETTINGS.logo,'JPEG',14,6,18,18); hx=38; }catch(e){} }
  doc.setFontSize(16); doc.setTextColor(255,255,255);
  doc.text(SETTINGS.shopName||'Orders Report', hx, 14);
  doc.setFontSize(9); doc.setTextColor(230,220,250);
  doc.text('ORDERS REPORT — '+rangeLabel, hx, 21);

  let y=40;
  doc.setFontSize(10); doc.setTextColor(30,20,50);
  doc.text('Total Orders: '+inRange.length, 14, y);
  doc.text('Total Value: Rs.'+totalRs, 80, y);
  doc.text('Deleted: '+(inRange.length-active.length), 150, y);
  y+=10;
  doc.setDrawColor(200,200,200); doc.line(14,y,196,y); y+=7;

  doc.setFontSize(9.5); doc.setTextColor(90,90,90);
  doc.text('Order ID',14,y); doc.text('Date',50,y); doc.text('Customer',90,y); doc.text('Amount',150,y); doc.text('Status',175,y);
  y+=4; doc.line(14,y,196,y); y+=6;
  doc.setFontSize(9); doc.setTextColor(30,20,50);
  [...inRange].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).forEach(o=>{
    if(y>280){ doc.addPage(); y=20; }
    const t = o.timestamp ? new Date(o.timestamp).toLocaleDateString('en-IN') : '';
    doc.text(String(o.orderId).slice(0,14),14,y);
    doc.text(t,50,y);
    doc.text(String(o.customerName||'-').slice(0,20),90,y);
    doc.text('Rs.'+o.total,150,y);
    doc.text(o.status||'Pending',175,y);
    y+=7;
  });
  doc.save('Orders_Report_'+rangeLabel.replace(/\s+/g,'_')+'.pdf');
}

let oc_ORDERS = [];

let oc_DASH_TIMER = null;
let oc_ALERTS_ON = false;
let oc_LAST_TOP_ORDER_ID = null;
let oc_FIRST_LOAD_DONE = false;

function oc_beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [0, 0.35, 0.7].forEach(off=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now+off);
      gain.gain.exponentialRampToValueAtTime(0.4, now+off+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+off+0.28);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+off); osc.stop(now+off+0.3);
    });
  }catch(e){}
}

function oc_enableAlerts(){
  oc_ALERTS_ON = true;
  oc_beep();
  if('Notification' in window && Notification.permission !== 'granted'){
    Notification.requestPermission();
  }
  document.getElementById('alertBtn').innerText = '🔔 Alerts ON ✅';
  document.getElementById('alertBtn').classList.add('green');

function oc_notifyNewOrder(order){
  if(!oc_ALERTS_ON) return;
  oc_beep();
  if('Notification' in window && Notification.permission === 'granted'){

    }catch(e){}

  setTimeout(()=>{ document.title = 'Order Catalog Editor'; }, 6000);

function oc_setDashFilter(f, btn){
  oc_DASH_FILTER = f;
  document.querySelectorAll('#dfilters button').forEach(b=>b.classList.remove('active'));

async function oc_loadOrders(){
  if(!oc_CONFIG.scriptUrl){
    document.getElementById('dlist').innerHTML = '<div class="dempty"><div class="big">⚠️</div>ముందు ⚙️ Order Setup లో Google Sheet URL పెట్టండి</div>';
    return;
  }
  document.getElementById('dlist').innerHTML = '<div class="dloading">⏳ Loading...</div>';
  try{
    const res = await fetch(oc_CONFIG.scriptUrl);
    const data = await res.json();
    const newOrders = data.orders || [];
    if(oc_FIRST_LOAD_DONE && newOrders.length > 0){
      const topId = newOrders[0].orderId;
      if(topId !== oc_LAST_TOP_ORDER_ID){
        const idx = newOrders.findIndex(o=>o.orderId===oc_LAST_TOP_ORDER_ID);
        const freshOnes = idx===-1 ? [newOrders[0]] : newOrders.slice(0, idx);
        freshOnes.forEach(o=>oc_notifyNewOrder(o));
      }
    }
    if(newOrders.length>0) oc_LAST_TOP_ORDER_ID = newOrders[0].orderId;
    oc_FIRST_LOAD_DONE = true;
    oc_ORDERS = newOrders;
    oc_renderDashboard();
  }catch(e){
    document.getElementById('dlist').innerHTML = '<div class="dempty"><div class="big">⚠️</div>Orders load కాలేదు. కొంచెం సేపు తర్వాత 🔄 Refresh నొక్కండి.</div>';
  }
}

  const completed = active.filter(o=>o.status==='Completed').length;
  const deletedCount = oc_ORDERS.filter(o=>o.status==='Deleted').length;
  const totalRs = active.reduce((a,b)=>a+(Number(b.total)||0),0);
  stats.innerHTML = `
    <div class="dstat"><div class="n">${active.length}</div><div class="l">మొత్తం ఆర్డర్లు</div></div>
    <div class="dstat"><div class="n">${pending}</div><div class="l">Pending</div></div>

    <div class="dstat"><div class="n">₹${totalRs}</div><div class="l">మొత్తం Value</div></div>
  `;
  let shown;
  if(oc_DASH_FILTER==='all') shown = active;
  else if(oc_DASH_FILTER==='Deleted') shown = oc_ORDERS.filter(o=>o.status==='Deleted');
  else shown = active.filter(o => (o.status||'Pending') === oc_DASH_FILTER);

  const list = document.getElementById('dlist');
  if(shown.length===0){
    list.innerHTML = oc_DASH_FILTER==='Deleted'
      ? '<div class="dempty"><div class="big">🗑️</div>Deleted ఆర్డర్లు ఏవీ లేవు</div>'
      : '<div class="dempty"><div class="big">📭</div>ఇంకా ఆర్డర్లు రాలేదు</div>';
    return;
  }
  list.innerHTML = shown.map(o=>{
    const status = o.status || 'Pending';
    const isDone = status === 'Completed';
    const isDeleted = status === 'Deleted';
    const t = o.timestamp ? new Date(o.timestamp).toLocaleString('en-IN') : '';
    return `<div class="dorder ${isDone?'done':''}">
      <div class="drow">
        <div>
          <div class="doid">#${o.orderId} • ${t}</div>
          <div class="dname">${o.customerName || '-'}</div>

        </div>

      </div>
      <div class="ditems">${o.items || ''}</div>
      <div class="dbar">
        <span class="dpill ${status}">${isDeleted?'🗑️ Deleted': status==='Completed' ? '✅ Completed' : '🕒 Pending'}</span>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${isDeleted
            ? `<button class="dtogglebtn" onclick="oc_restoreOrder('${o.orderId}')">♻️ Restore</button>`
            : `<button class="dtogglebtn" onclick="oc_toggleOrderStatus('${o.orderId}','${isDone?'Pending':'Completed'}')">${isDone ? 'Pending కి మార్చు' : '✅ Complete చేయండి'}</button>

async function oc_toggleOrderStatus(orderId, newStatus){
